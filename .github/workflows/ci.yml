# Typecheck / lint / test gate. Runs on main and any PR into it.
name: checks

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # A5: the RLS attack suite against a throwaway local Supabase built from
  # supabase/migrations (never production). Two users try to read and change
  # each other's rows across every table; the attacks failing is the pass.
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,realtime,postgres-meta
      - run: |
          eval "$(supabase status -o env)"
          RLS_URL="$API_URL" RLS_ANON_KEY="$ANON_KEY" node supabase/migrations/tests/rls-attacks.test.mjs
