<style>

:root{

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1915; --card:#29241F; --line:#3C352D; --ink:#F2EBE2; --ink-soft:#B3A89B; --edge:#5E554A; --hi:#EE8559; --hi-soft:#4A2C20;

  --bg:#1C1915; --card:#29241F; --line:#3C352D; --ink:#F2EBE2; --ink-soft:#B3A89B; --edge:#5E554A; --hi:#EE8559; --hi-soft:#4A2C20;

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--body);display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.ttl{display:flex;flex-direction:column;gap:2px;min-width:0}
h1{font:700 21px/1.1 var(--display);margin:0}
.sub{font-size:12px;color:var(--ink-soft)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-soft);align-items:center}
.legend svg{vertical-align:middle;margin-right:4px}
.zoom{margin-left:auto;display:flex;gap:4px}

.zoom button:focus-visible,.node:focus-visible,.notes button:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.view{flex:1;overflow:auto;position:relative;min-height:0}
.sizer{position:relative}
.canvas{position:absolute;left:0;top:0;transform-origin:0 0}
.zone{position:absolute;border-radius:18px;background:color-mix(in srgb,var(--c) 8%,transparent)}
.zone span{position:absolute;left:14px;top:11px;right:10px;font:700 11px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.zone.tabs{background:transparent;border:1.5px dashed color-mix(in srgb,var(--c) 60%,transparent)}
svg.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.e{fill:none;stroke:var(--edge);stroke-width:1.6;transition:stroke .15s,opacity .15s}
.e.dash{stroke-dasharray:5 5}
.lbl{font:600 10.5px var(--body);fill:var(--ink-soft);paint-order:stroke;stroke:var(--bg);stroke-width:4px;transition:opacity .15s}
.node{position:absolute;width:176px;min-height:58px;padding:9px 12px 9px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;cursor:pointer;transition:border-color .15s,opacity .15s,box-shadow .15s;box-shadow:0 1px 2px rgba(34,29,24,.06)}
.node::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.node b{font-weight:650;font-size:13.5px;line-height:1.25;padding-right:34px}
.node i{font-style:normal;font-size:11px;color:var(--ink-soft);line-height:1.3}
.node em{position:absolute;right:8px;top:8px;font:600 9.5px/1.6 var(--body);font-style:normal;letter-spacing:.05em;text-transform:uppercase;color:var(--c)}
.node.dec{border-style:dashed;border-color:var(--ink-soft)}
.node.sys{border-style:dashed;border-color:var(--c)}
.node.key{border:2px solid var(--c)}
.node.start{border:2px solid var(--ink)}
.focus .node{opacity:.25}.focus .node.on{opacity:1;border-color:var(--hi);box-shadow:0 0 0 3px var(--hi-soft)}
.focus .e{opacity:.1}.focus .e.on{opacity:1;stroke:var(--hi)}
.focus .lbl{opacity:0}.focus .lbl.on{opacity:1;fill:var(--hi)}
.notes{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));width:min(340px,calc(100% - 28px));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 6px 24px rgba(34,29,24,.12);font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.notes .hd{display:flex;justify-content:space-between;align-items:center;font:700 11px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--hi)}
.notes button{all:unset;cursor:pointer;color:var(--ink-soft);font-size:16px;line-height:1;padding:2px 4px}
.notes ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:4px}
.notes .src{font:400 10.5px/1.4 var(--mono);color:var(--ink-soft);overflow-wrap:anywhere}
.hint{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));font-size:12px;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;pointer-events:none}
@media (max-width:640px){.hint{display:none}}
@media (prefers-reduced-motion:reduce){.e,.node,.lbl{transition:none}}

"shares",1],["e","acct","install",1],["acct","dest","",1]],"sources":["https://apps.apple.com/gb/app/cherrypick-plan-shop-cook/id1567423761 (v2.58.0 notes: referral system)","Mobbin flow d5df0e40-2100-496e-af83-6e76c4e8489a (Invite friends)","Mobbin flow 2dfc4689-86e7-4800-beb3-5b0334bc22b3 (Creating an account)","Mobbin flow 9e6220e1-7153-4ea3-81a1-819cfbb287b9 (22-screen onboarding, no permission prompts)"]},{"n":3,"verdict":"unknown","summary":"The only permission-gated feature seen is the profile photo (\"Photo Library / Take Photo / Choose File\"). What happens when camera access is denied isn't captured, and onboarding asks for no permissions.","steps":[["e","Add image","Settings, profile photo",0,0,"entry","seen"],["menu","Source menu","Photo Library / Take Photo / Choose File",1,0,"screen","seen"],["cam","Camera alert","iOS permission prompt",2,0,"sys","unverified"],["den","Denied fallback?","Library still works?",3,1,"dec","unverified"],["ok","Success!","\"Profile image updated.\"",4,0,"out","seen"]],"edges":[["e","menu","",0],["menu","cam","Take Photo",0],["cam","den","Don't Allow",1],["menu","ok","Library",0],["cam","ok","Allow",0]],"sources":["Mobbin screens 6b8f20f6-2c5a-4b21-9122-1051861e441c (source menu), 4c7f72d3-f69c-42b5-9d6a-36547d05eed3 (crop), 5cb3b2ab-11a0-4d9a-87ce-b572216fe2f8 (success toast)","Mobbin flow 9e6220e1-7153-4ea3-81a1-819cfbb287b9 (onboarding, no permission screens)"]},{"n":4,"verdict":"unknown","summary":"The Pro trial starts automatically with no purchase step. Paying begins at \"See available plans\", but no plans screen or StoreKit outcome (success, cancel, pending, failure) is captured. The App Store lists Plus and Pro in-app purchases.","steps":[["e","See available plans","trial banner link",0,0,"entry","seen"],["plans","Plans screen","Plus / Pro (£2.99–£41.99 IAPs)",1,0,"screen","doc"],["sk","StoreKit sheet","Apple purchase",2,0,"sys","unverified"],["res","Outcome?","success / cancel / pending",3,0,"dec","unverified"],["pro","Pro active","no capture",4,0,"out","unverified"]],"edges":[["e","plans","",0],["plans","sk","",1],["sk","res","",1],["res","pro","success",1]],"sources":["Mobbin screen 71cf58bf-543d-44d7-9272-5cca5c23b6a4 (\"Your Pro trial ends in 7 days / See available plans\")","https://apps.apple.com/gb/app/cherrypick-plan-shop-cook/id1567423761 (In-app purchases: Cherrypick Plus/Pro)"]},{"n":5,"verdict":"unknown","summary":"A trial countdown appears on Plan and You (7, 6, 5 days, then \"See available plans\"). The day-0 downgrade, any grace period, and what the free tier keeps aren't captured. Cherrypick says there will \"always be a free tier\", and its terms say cancellation takes effect at the end of the paid term.","steps":[["e","Trial running","\"Your Pro trial ends in 7 days\"",0,0,"entry","seen"],["you","You tab banner","\"…ends in 5 days\"",1,0,"screen","seen"],["end","Trial ends","what shows on day 0?",2,0,"dec","unverified"],["free","Free tier","\"always be a free tier\"",3,0,"out","doc"],["grace","Billing grace?","not documented",3,1,"screen","unverified"]],"edges":[["e","you","",0],["you","end","",0],["end","free","no plan",1],["end","grace","billing fail",1]],"sources":["Mobbin screens 71cf58bf-543d-44d7-9272-5cca5c23b6a4 (7 days), e1d2a28a-0666-4522-8c23-dc44377fcf95 (You, 5 days)","Mobbin screen e501f9c7-0c45-4cac-991d-253880923000 (\"Your free Pro starts now! … all recipes and features for 24 days. Manage plan\")","https://www.thegrocer.co.uk/online/shopping-platform-cherrypick-to-introduce-paid-for-tiers/692727.article","https://www.cherrypick.co/terms (\"cancellation will take effect at the end of the current paid term\"; terms say 14-day trial, app shows 7)"]},{"n":6,"verdict":"partial","summary":"Account-based: an email/password login lands on Plan, and You → Account has a \"Restore purchases\" row. No paywall capture shows Restore, and there's no evidence that Pro status follows the account to a new device.","steps":[["e","New device","fresh install",0, y":"No public evidence about offline behaviour. Recipes, the basket and checkout are all server and supermarket backed. No offline banner or error screen is captured on Mobbin, and neither the App Store listing nor the website mentions offline use.","steps":[["e","No connection","any tab",0,0,"entry","unverified"],["dec","Cached plan?","not documented",1,0,"dec","unverified"],["out","Offline state","no capture",2,0,"out","unverified"]],"edges":[["e","dec","",1],["dec","out","",1]],"sources":["Mobbin search 'Cherrypick error/no connection' returned no screens","https://apps.apple.com/gb/app/cherrypick-plan-shop-cook/id1567423761 (no offline claim)"]},{"n":9,"verdict":"partial","summary":"There's no What's New modal. New features show as in-feed cards on Plan (\"The 2 minute shop is here!\") with normal navigation kept. Whether the cards can be dismissed isn't seen. App Store notes are generic.","steps":[["e","App updated","e.g. v2.74.0 (28 Oct)",0,0,"entry","doc"],["plan","Plan it","normal home, no modal",1,0,"screen","seen"],["card","Feature card","\"The 2 minute shop is here!\"",2,0,"screen","seen"],["flow","Meal-plan and shop","\"Start 2 min shop\"",3,0,"out","seen"],["dis","Dismissible?","no close control seen",2,1,"dec","unverified"]],"edges":[["e","plan","",0],["plan","card","",0],["card","flow","tap",1],["card","dis","",1]],"sources":["https://apps.apple.com/gb/app/cherrypick-plan-shop-cook/id1567423761 (version history 2.49.0–2.74.0)","Mobbin screen 71cf58bf-543d-44d7-9272-5cca5c23b6a4 (Plan with feature card)","Mobbin flow 9e6220e1-7153-4ea3-81a1-819cfbb287b9 (\"Meal-plan and shop in under 2 mins!\")"]},{"n":10,"verdict":"partial","summary":"The only failure state captured is supermarket stock: \"You have 1 unavailable item\" with \"Find alternative\" or remove, and the basket is kept. No server, AI Shopping List or checkout error screens were found, and the website has no help docs.","steps":[["b","Basket","Item \"Currently unavailable\"",0,0,"screen","seen"],["u","\"1 unavailable item\"","\"Find alternatives… or remove\"",1,0,"screen","seen"],["r","\"Remove this item?\"","\"Yes, remove\" / \"No, cancel\"",2,1,"dec","seen"],["co","Checkout with Sainsbury's","Basket total kept",2,0,"out","seen"],["se","Server/AI error?","Not captured",1,2,"dec","unverified"]],"edges":[["b","u","Checkout",0],["u","co","alternative",0],["u","r","",1],["r","co","",0],["b","se","",1]],"sources":["Mobbin screens c09b857b-b532-42bb-8b56-d608625e3a37 (Currently unavailable), 9c60adb4-71cd-4c77-887a-bdc1df5a3ba8 (You have 1 unavailable item), 43b00d72-bafe-497c-a3a2-5073e6b02c30 (Remove this item?)","Mobbin search 'Cherrypick error/no connection' (lane 8) returned no screens"]},{"n":11,"verdict":"misses","summary":"AI Shopping List uses \"your regulars and order frequency\", and the privacy notice lists OpenAI (text parsing) and Google Vision (image parsing) as processors, but no AI consent or toggle was seen. The consent that is traced, the supermarket link, is withdrawn by un-linking on the You page.","steps":[["ai","AI Shopping List intro","\"Generate my list\"",0,0,"screen","seen"],["nc","No AI consent","OpenAI listed as processor",1,0,"out","gap"],["sl","Connect to Sainsbury's","Settings button",0,1,"screen","seen"],["ul","Un-link on You page","Withdraws consent",1,1,"screen","doc"],["dl","Data anonymised/deleted","On withdrawal",2,1,"out","doc"]],"edges":[["ai","nc","",0],["sl","ul","",1],["ul","dl","",0]],"sources":["Mobbin screen 499216c6-9a89-405c-9f1d-a2eecd52791f (Fill your basket using the AI Shopping List)","Mobbin flow 9e6220e1-7153-4ea3-81a1-819cfbb287b9 (onboarding: no consent screens)","Mobbin flow eeba6ada-2124-4896-86eb-9a52970c6c6c (Settings: Connect to Sainsbury's)","https://www.cherrypick.co/privacy (processors: 'OpenAI, LLC Text parsing', 'Google Vision image parsing'; un-link 'via the \"You\" page' withdraws consent)"]},{"n":12,"verdict":"partial","summary":"Log in is email and password only (\"Welcome back!\" with \"Fo Plan is never empty; it's pre-filled with \"Top picks for you\".","steps":[["sh","Shop tab, empty","\"Your basket is empty\"",0,0,"screen","seen"],["m","Meals card","\"Reveal your handpicked menu\"",1,0,"screen","seen"],["ai","AI Shopping List card","\"Add your weekly essentials in a tap\"",1,1,"screen","seen"],["pl","Plan tab","Pre-filled \"Top picks for you\"",0,1,"screen","seen"],["sv","Saved empty?","Not captured",1,2,"screen","unverified"]],"edges":[["sh","m","",0],["sh","ai","",1],["pl","sv","",1]],"sources":["Mobbin screen 5dac7c84-338f-4e95-a256-d04d827c684c (Your basket is empty)","Mobbin screen 71cf58bf-543d-44d7-9272-5cca5c23b6a4 (Plan with Top picks)"]}]}};
const CX=220, RY=92, X0=30, Y0=58, NW=176;
const STAGE={entry:"--s-entry",welcome:"--s-welcome",account:"--s-account",q:"--s-q",proof:"--s-proof",perm:"--s-perm",reveal:"--s-reveal",pay:"--s-pay",home:"--s-home",core:"--s-core",later:"--s-later"};
document.getElementById("h1").textContent=APP.title;
document.getElementById("sub").textContent=APP.sub;
document.getElementById("nl").innerHTML=APP.notes.map(n=>`<li>${n}</li>`).join("");
document.getElementById("src").textContent="Sources: "+APP.src;

const canvas=document.getElementById("canvas"), svg=document.getElementById("edges");
const el={}; let maxC=0,maxR=0;
for(const [id,title,sub,c,r,st,tag,kind] of APP.nodes){
  const d=document.createElement("div");
  d.className="node"+(kind?" "+kind:"");
  d.tabIndex=0; d.dataset.id=id; d.dataset.zone=APP.zones.findIndex(z=>z.cols.includes(c));
  d.style.left=(X0+c*CX)+"px"; d.style.top=(Y0+r*RY)+"px"; d.style.setProperty("--c",`var(${STAGE[st]})`);
  d.innerHTML=`<b>${title}</b>${sub?`<i>${sub}</i>`:""}${tag?`<em>${tag}</em>`:""}`;
  canvas.appendChild(d); el[id]=d; maxC=Math.max(maxC,c); maxR=Math.max(maxR,r);
}
// Scenario lanes: the 9 edge cases from the Apple gold standard, traced for this app.
// Shared by template.html (via build.mjs) and maps/otto.html. Each step carries its evidence.
const LANE_CSS=`
.lane{position:absolute;border-radius:18px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 55%,transparent)}
.lane .lh{position:absolute;left:16px;right:16px;top:12px;display:flex;flex-direction:column;gap:3px}
.lane .lt{display:flex;align-items:center;gap:10px;font:700 15px/1.2 var(--body)}
.lane .std{font-size:11.5px;color:var(--ink-soft)}
.lane .sum{font-size:12.5px}
.lane .ls{position:absolute;left:16px;right:16px;bottom:10px;font:400 10px/1.35 var(--mono);color:var(--ink-soft);overflow-wrap:anywhere;max-height:28px;overflow:hidden}
.verd{font:700 10px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:999px;color:#fff;background:var(--v)}
.lanes-hd{position:absolute;font:700 22px/1.2 var(--display)}
.lanes-sub{position:absolute;font-size:12.5px;color:var(--ink-soft)}
.ln.dec{border-style:dashed;border-color:var(--ink-soft)}
.ln.sys{border-style:dashed;border-color:var(--c)}
.ln.key{border:2px solid var(--c)}
.ln.start{border:2px solid var(--ink)}
.node.ev-unverified{border-style:dotted;opacity:.72}
.node.ev-gap{border:2px solid var(--gap)}
.node em.ev{position:static;align-self:flex-start;margin-top:3px;background:none;padding:0;border:0;font-style:normal;font:600 9.5px/1 var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft)}
.node.ev-gap em.ev{color:var(--gap)}
:root{--gap:#C0392B;--ok:#3F7A3B;--mid:#A87512;--unk:#8C8378}
`;
const LANE_STD=["Restore where people left off; never replay onboarding or reset navigation.",
"Continue to the asked-for destination after sign-in or purchase; never drop people on Home.",
"Keep working without the permission; don't re-ask with your own alert; Settings link where the feature lives.",
"Handle every result: cancel is not an error, Ask to Buy keeps free access, failure charges nothing.",
"Keep access during the grace period and say so; downgrade gently; never delete what people made.",
"Signing in restores; no-account apps need Restore Purchases in the paywall and in Settings.",
"Start deletion in the app, explain it, confirm once, return to the signed-out app (Review 5.1.1(v)).",
"Offline is a state, not an error: cached content with a quiet banner.",
"Show meaningful changes once, dismissible, then the last state. Skip it for bug-fix releases.",
"Explain what happened and what to do, offer retry, never lose what the person typed or photographed; state limits before they bite.",
"Withdrawing consent is as easy as giving it; features that need it ask again at the moment of use; background use stops (Review 5.1.2(i)).",
"A cancelled sign-in is not an error; wrong details explain the fix; sign out returns to a signed-out app that still offers sign-in and clears private data.",
"Data follows the account to every device; shared content updates for every member; joining and leaving are explained and reversible; no edit is lost.",
"Every tab and list has a designed empty state that says what goes there and offers the first action. Never a blank screen or a dead end."];
const LANE_T=["Returning launch → restore last state","Link or notification entry, in every state","Permission denied → fallback, then Settings","Purchase outcomes","Subscription lapses → grace period → free tier","Restore on a new device","Delete account","Offline","Update → What's new","AI or server error, rate limit, timeout","AI consent withdrawn","Sign-in edge cases and sign out","Second device and household sharing","Empty states on first use"];
const VERD={meets:["Meets","var(--ok)"],partial:["Partial","var(--mid)"],misses:["Misses","var(--gap)"],unknown:["Unknown","var(--unk)"],standard:["Standard","var(--hi,#C4562E)"]};
const EVL={seen:"seen",doc:"help doc",report:"user report",unverified:"unverified",gap:"gap vs Apple",std:""};
const KC={entry:"var(--s-entry,#8C8378)",screen:"var(--s-home,#4E8A4A)",dec:"var(--ink-soft)",sys:"var(--s-perm,#22897C)",out:"var(--s-core,#2F6B4F)"};
function renderLanes(canvas,el,edges,o){
  const L=o.lanes; if(!L||!L.lanes||!L.lanes.length) return 0;
  const st=document.createElement("style"); st.textContent=LANE_CSS; document.head.appendChild(st);
  const HEAD=86, FOOT=40; let y=o.top;
  const h=document.createElement("div"); h.className="lanes-hd"; h.style.left=o.x0+"px"; h.style.top=y+"px"; h.textContent=`Scenario lanes · ${L.lanes.length} edge cases`; canvas.appendChild(h);
  const s=document.createElement("div"); s.className="lanes-sub"; s.style.left=o.x0+"px"; s.style.top=(y+32)+"px"; s.style.width=(o.width-2*o.x0)+"px";
  s.textContent=(L.intro||"What this app really does in each case, against Apple's standard. Tags show the evidence for every step: seen (screen observed), help doc, user report, unverified, gap vs Apple.")+(L.researched?` Researched ${L.researched}.`:"");
  canvas.appendChild(s); y+=72;
  for(const ln of [...L.lanes].sort((a,b)=>a.n-b.n)){
    const box=document.createElement("div"); box.className="lane";
    const [vl,vc]=VERD[ln.verdict]||VERD.unknown;
    box.innerHTML=`<div class="lh"><div class="lt">${ln.n} · ${LANE_T[ln.n-1]}<span class="verd" style="--v:${vc}">${vl}</span></div><div class="std">Apple: ${LANE_STD[ln.n-1]}</div><div class="sum">${ln.summary||""}</div></div>${ln.sources&&ln.sources.length?`<div class="ls" title="${ln.sources.join(" · ").replace(/"/g,"&quot;")}">Sources: ${ln.sources.join(" · ")}</div>`:""}`;
    canvas.insertBefore(box,canvas.querySelector("svg"));
    Object.assign(box.style,{left:(o.x0-14)+"px",top:y+"px",width:(o.width-2*o.x0+28)+"px"});
    const head=Math.max(HEAD,box.querySelector(".lh").offsetHeight+28);
    const made=[];
    for(const [id,title,sub,c,r,kind,ev] of ln.steps){
      const k=`L${ln.n}_${id}`, d=document.createElement("div");
      d.className="node ln"+(kind==="dec"?" dec":kind==="sys"?" sys":kind==="out"?" key":kind==="entry"?" start":"")+(ev?" ev-"+ev:"");
      d.tabIndex=0; d.dataset.id=k; d.style.left=(o.x0+c*o.cx)+"px"; d.style.setProperty("--c",KC[kind]||KC.screen);
      d.innerHTML=`<b>${title}</b>${sub?`<i>${sub}</i>`:""}${ev&&EVL[ev]?`<em class="ev">${EVL[ev]}</em>`:""}`;
      canvas.appendChild(d); el[k]=d; made.push([d,r]);
    }
    // Rows size to their tallest card, so long subtitles never overlap the next row.
    const rows=Math.max(...made.map(m=>m[1]))+1, rh=Array(rows).fill(o.ry-24);
    made.forEach(([d,r])=>rh[r]=Math.max(rh[r],d.offsetHeight));
    const rt=[]; let acc=y+head; for(let r=0;r<rows;r++){rt[r]=acc; acc+=rh[r]+24;}
    made.forEach(([d,r])=>d.style.top=rt[r]+"px");
    const lh=acc-y+FOOT-24;
    box.style.height=lh+"px";
    for(const [f,t,label,dash] of ln.edges||[]) if(el[`L${ln.n}_${f}`]&&el[`L${ln.n}_${t}`]) edges.push([`L${ln.n}_${f}`,`L${ln.n}_${t}`,label||"",dash?1:0]);
    y+=lh+22;
  }
  return y-o.top;
}

const laneC=APP.lanes?Math.max(0,...APP.lanes.lanes.flatMap(l=>l.steps.map(x=>x[3]))):0;
const W=X0+Math.max(maxC,laneC)*CX+NW+40, H0=Y0+(maxR+1)*RY+24;
const H=H0+renderLanes(canvas,el,APP.edges,{lanes:APP.lanes,top:H0+40,x0:X0,cx:CX,ry:RY,width:W})+(APP.lanes?40:0);
canvas.style.width=W+"px"; canvas.style.height=H+"px"; svg.setAttribute("width",W); svg.setAttribute("height",H);

function zones(){
  canvas.querySelectorAll(".zone").forEach(z=>z.remove());
  APP.zones.forEach((z,i)=>{
    const ns=[...canvas.querySelectorAll(`.node[data-zone="${i}"]`)]; if(!ns.length) return;
    const x0=Math.min(...ns.map(n=>n.offsetLeft))-14, x1=Math.max(...ns.map(n=>n.offsetLeft+n.offsetWidth))+14;
    const y0=Math.min(...ns.map(n=>n.offsetTop))-36, y1=Math.max(...ns.map(n=>n.offsetTop+n.offsetHeight))+14;
    const d=document.createElement("div"); d.className="zone"+(z.tabs?" tabs":"");
    Object.assign(d.style,{left:x0+"px",top:y0+"px",width:(x1-x0)+"px",height:(y1-y0)+"px"}); d.style.setProperty("--c",`var(${STAGE[z.st]})`);
    d.innerHTML=`<span>${z.label}</span>`; canvas.insertBefore(d,svg);
  });
}

const NS="http://www.w3.org/2000/svg";
svg.innerHTML=`<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--edge)"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--hi)"/></marker></defs>`;
const box=id=>{const d=el[id];return{x:d.offsetLeft,y:d.offsetTop,w:d.offsetWidth,h:d.offsetHeight};};
const paths=[];
function draw(){
  paths.forEach(p=>{p.path.remove();p.text&&p.text.remove();}); paths.length=0;
  for(const [f,t,label,dash] of APP.edges){
    const a=box(f), b=box(t); let d,lx,ly,anchor="middle";
    const ay=a.y+a.h/2, by=b.y+b.h/2;
    if(b.x>=a.x+a.w){ const sx=a.x+a.w, ex=b.x-2, k=Math.max(40,(ex-sx)/2);
      d=`M${sx} ${ay}C${sx+k} ${ay} ${ex-k} ${by} ${ex} ${by}`; lx=(sx+ex)/2; ly=(ay+by)/2-6; }
    else if(b.x+b.w<=a.x){ const sx=a.x, ex=b.x+b.w+2, k=Math.max(50,(sx-ex)/2);
      d=`M${sx} ${ay}C${sx-k} ${ay} ${ex+k} ${by} ${ex} ${by}`; lx=(sx+ex)/2; ly=(ay+by)/2-6; }
    else if(b.y>a.y && b.y-(a.y+a.h)<60){ const x=a.x+a.w/2;
      d=`M${x} ${a.y+a.h}L${x} ${b.y-2}`; lx=x+8; ly=(a.y+a.h+b.y)/2+4; anchor="start"; }
    else { const sx=a.x+a.w, ex=b.x+b.w+2, off=26+Math.abs(by-ay)*.12;
      d=`M${sx} ${ay}C${sx+off} ${ay} ${ex+off} ${by} ${ex} ${by}`; lx=sx+off*.75+4; ly=(ay+by)/2+4; anchor="start"; }
    const p=document.createElementNS(NS,"path"); p.setAttribute("d",d); p.setAttribute("class","e"+(dash?" dash":"")); p.setAttribute("marker-end","url(#a)"); svg.appendChild(p);
    let tx=null; if(label){ tx=document.createElementNS(NS,"text"); tx.setAttribute("x",lx); tx.setAttribute("y",ly); tx.setAttribute("text-anchor",anchor); tx.setAttribute("class","lbl"); tx.textContent=label; svg.appendChild(tx); }
    paths.push({f,t,path:p,text:tx});
  }
  zones();
}

let active=null;
function focus(id){
  active=(active===id)?null:id; canvas.classList.toggle("focus",!!active);
  Object.values(el).forEach(n=>n.classList.remove("on"));
  paths.forEach(p=>{const on=active&&(p.f===active||p.t===active);
    p.path.classList.toggle("on",!!on); p.path.setAttribute("marker-end",on?"url(#ah)":"url(#a)"); p.text&&p.text.classList.toggle("on",!!on);
    if(on){el[p.f].classList.add("on");el[p.t].classList.add("on");}});
  if(active) el[active].classList.add("on");
}
canvas.addEventListener("click",e=>{const n=e.target.closest(".node"); if(n) focus(n.dataset.id); else if(active) focus(active);});
canvas.addEventListener("keydown",e=>{const n=e.target.closest(".node"); if(n&&(e.key==="Enter"||e.key===" ")){e.preventDefault();focus(n.dataset.id);} if(e.key==="Escape"&&active) focus(active);});

const view=document.getElementById("view"), sizer=document.getElementById("sizer"), notes=document.getElementById("notes");
let s=1; const fitScale=()=>Math.min(1.2,(view.clientWidth-12)/W,(view.clientHeight-12)/H0);
function setScale(v){ s=Math.max(.25,Math.min(1.8,v)); canvas.style.transform=`scale(${s})`; sizer.style.width=W*s+"px"; sizer.style.height=H*s+"px"; }
document.getElementById("zi").onclick=()=>setScale(s+.15);
document.getElementById("zo").onclick=()=>setScale(s-.15);
document.getElementById("zf").onclick=()=>setScale(fitScale());
const zn=document.getElementById("zn");
function showNotes(on){notes.hidden=!on; zn.setAttribute("aria-pressed",on);}
zn.onclick=()=>showNotes(notes.hidden); document.getElementById("nx").onclick=()=>showNotes(false);
draw(); setScale(fitScale());
addEventListener("resize",()=>setScale(fitScale()));
document.fonts&&document.fonts.ready.then(()=>{draw();setScale(fitScale());});
</script>
